            transition: var(--transition);
            left: 0;
        }
        .hamburger span:nth-child(1) { top: 0; }
        .hamburger span:nth-child(2) { top: 50%; transform: translateY(-50%); width: 70%; }
        .hamburger span:nth-child(3) { bottom: 0; }
        .hamburger.active span:nth-child(1) { top: 50%; transform: translateY(-50%) rotate(45deg); }
        .hamburger.active span:nth-child(2) { opacity: 0; }

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var mobileMenuToggle = document.querySelector('.mobile-menu-toggle');
            var navLinks         = document.querySelector('.nav-links');
            var hamburger        = document.querySelector('.hamburger');
            var mobileOverlay    = document.querySelector('.mobile-overlay');
            var nav              = document.querySelector('nav');
            var userProfileBtn   = document.getElementById('userProfileBtn');
            var userDropdown     = document.getElementById('userDropdown');

            // Check session and update cart on page load
            checkSessionStatus();
            updateCartCount();

            // User Profile Dropdown Toggle
            if (userProfileBtn) {
                userProfileBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    var isOpen = userDropdown.classList.toggle('active');
                    userProfileBtn.setAttribute('aria-expanded', isOpen);
                });
            }
            // Close dropdown when clicking outside
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.user-profile-item')) {
                    userDropdown.classList.remove('active');
                    if (userProfileBtn) userProfileBtn.setAttribute('aria-expanded', 'false');
                }
            });

            // Mobile menu toggle
            if (mobileMenuToggle) {
                mobileMenuToggle.addEventListener('click', function() {
                    var isOpen = navLinks.classList.toggle('active');
                    hamburger.classList.toggle('active');
                    mobileOverlay.classList.toggle('active');
                    mobileMenuToggle.setAttribute('aria-expanded', isOpen);
                    document.body.style.overflow = isOpen ? 'hidden' : '';
                });
            }

            // Mobile overlay click closes menu
            if (mobileOverlay) {
                mobileOverlay.addEventListener('click', function() {
                    navLinks.classList.remove('active');
                    hamburger.classList.remove('active');
                    mobileOverlay.classList.remove('active');
                    mobileMenuToggle.setAttribute('aria-expanded', 'false');
                    document.body.style.overflow = '';
                });
            }

            // Close menu when clicking nav links
            document.querySelectorAll('.nav-links a:not(.cart-link):not(.user-profile-link)').forEach(function(link) {
                link.addEventListener('click', function() {
                    navLinks.classList.remove('active');
                    hamburger.classList.remove('active');
                    mobileOverlay.classList.remove('active');
                    document.body.style.overflow = '';
                    userDropdown.classList.remove('active');
                });
            });

            // Scroll effect on nav
            window.addEventListener('scroll', function() {
                nav.classList.toggle('scrolled', window.scrollY > 50);
            }, { passive: true });

            // Escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (navLinks.classList.contains('active')) {
                        navLinks.classList.remove('active');
                        hamburger.classList.remove('active');
                        mobileOverlay.classList.remove('active');
                        document.body.style.overflow = '';
                    }
                    userDropdown.classList.remove('active');
                }
            });

            // Handle window resize
            window.addEventListener('resize', function() {
                if (window.innerWidth > 992) {
                    navLinks.classList.remove('active');
                    hamburger.classList.remove('active');
                    mobileOverlay.classList.remove('active');
                    document.body.style.overflow = '';
                }
            }, { passive: true });
        });

        function checkSessionStatus() {
            fetch('check_session.php')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var userProfileItem = document.getElementById('userProfileItem');
                    var getStartedItem  = document.getElementById('getStartedItem');
                    if (data.isLoggedIn) {
                        if (userProfileItem) userProfileItem.style.display = 'block';
                        if (getStartedItem)  getStartedItem.style.display  = 'none';
                    } else {
                        if (userProfileItem) userProfileItem.style.display = 'none';
                        if (getStartedItem)  getStartedItem.style.display  = 'block';
                    }
                })
                .catch(function() {
                    var getStartedItem = document.getElementById('getStartedItem');
                    if (getStartedItem) getStartedItem.style.display = 'block';
                });
        }

        function updateCartCount() {
            fetch('get_cart_count.php')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var cartCountEl = document.getElementById('cartCount');
                    var cartItemEl  = document.getElementById('cartItem');
                    if (cartCountEl && cartItemEl) {
                        var count = parseInt(data.count) || 0;
                        cartCountEl.textContent = count;
                        cartCountEl.setAttribute('aria-label', count + ' items in cart');
                        cartItemEl.style.display = count > 0 ? 'block' : 'none';
                    }
                })
                .catch(function() {
                    var cartItemEl = document.getElementById('cartItem');
                    if (cartItemEl) cartItemEl.style.display = 'block';
                });
        }

        function deactivateSession() {
            fetch('deactivate_session.php', { method: 'POST' })
                .then(function(r) { return r.json(); })
                .then(function(data) { if (data.success) location.href = 'default.php'; })
                .catch(function(e) { console.error('Error deactivating session:', e); });
        }

        // Global access
        window.updateCartCount  = updateCartCount;
        window.deactivateSession = deactivateSession;
    </script>
</body>
</html>
